# DLightroom for Intel Macs: builds the full desktop app on GitHub's Intel macOS 15 runner with
# Xcode 16.4, runs the app's and the packaging's tests, assembles DLightroom.app (ad-hoc signed, no
# credentials needed) and uploads it as a ZIP artifact. Nothing is signed with a certificate,
# notarized or released here.
name: macOS Intel (DLightroom.app)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 16.4
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            echo "::warning::Xcode 16.4 is not on this runner image; building with $(xcode-select -p)"
          fi
          xcodebuild -version
          sw_vers
          uname -m

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-intel-x86_64

      - name: Test the desktop app and the packaging checks
        run: |
          cargo test --locked -p vectorcraft
          cargo test --locked -p xtask

      - name: Build and assemble DLightroom.app
        run: packaging/macos/build-app.sh --arch x86_64

      - name: Check the bundle runs on Intel
        run: |
          APP=target/macos-app/DLightroom.app
          lipo -archs "$APP/Contents/MacOS/DLightroom" | grep -qx x86_64
          otool -l "$APP/Contents/MacOS/DLightroom" | grep -A4 LC_BUILD_VERSION || true
          file "$APP/Contents/MacOS/DLightroom"
          codesign --display --verbose=2 "$APP"
          ls -lh dist/release/

      - name: Upload DLightroom.app (ZIP)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DLightroom-macos-x86_64
          path: dist/release/DLightroom-*-macos-x86_64.zip
          if-no-files-found: error
          retention-days: 30
