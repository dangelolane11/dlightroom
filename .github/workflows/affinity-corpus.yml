# DLightroom: manual-only. This upstream VectorCraft workflow relies on storytold's shared workflows,
# corpora or signing secrets; run it from the Actions tab when wanted. macos-intel.yml is DLightroom's build.
name: Affinity 3 corpus

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affinity-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affinity3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AFFINITY_CORPUS_REQUIRED: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
      - name: Fetch pinned and checksum-verified corpus
        run: cargo xtask corpus --affinity
      - name: Parse every file and freeze actual Affinity 3 feature retention
        run: cargo test -p vectorcraft-affinity --all-features -- --nocapture
      - name: Check every artboard, native save, SVG, PDF and PSD exports
        run: cargo test -p vectorcraft-engine --test affinity_artboards --test affinity_text --test affinity_corpus -- --nocapture
