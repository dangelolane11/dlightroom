<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DLightroom app icon. Original artwork made for DLightroom (geometric, hand-written SVG; no
       third-party material). MIT OR Apache-2.0, see assets/app-icon/LICENSE.txt. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc24b"/>
      <stop offset="0.5" stop-color="#ff5d5d"/>
      <stop offset="1" stop-color="#7b3df0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#dawn)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- The letter D, drawn as one editable path: a stem and a Bézier bowl. -->
    <path d="M168 132 H248 C340 132 380 196 380 256 C380 316 340 380 248 380 H168 Z"
          fill="none" stroke="#fffaf2" stroke-width="42" stroke-linejoin="round"/>
    <!-- The bowl's anchor point and its tangent handle, as a pen tool shows them. -->
    <g stroke="#2b1746" stroke-width="7">
      <line x1="380" y1="178" x2="380" y2="334"/>
      <circle cx="380" cy="178" r="12" fill="#fffaf2"/>
      <circle cx="380" cy="334" r="12" fill="#fffaf2"/>
      <rect x="365" y="241" width="30" height="30" fill="#fffaf2"/>
      <rect x="153" y="117" width="30" height="30" fill="#fffaf2"/>
      <rect x="153" y="365" width="30" height="30" fill="#fffaf2"/>
    </g>
    <!-- A spark of light in the bowl. -->
    <path d="M272 214 Q276 252 314 256 Q276 260 272 298 Q268 260 230 256 Q268 252 272 214 Z" fill="#fffaf2"/>
  </g>
</svg>
